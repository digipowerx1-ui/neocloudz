<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon — NeoCloudz</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0f0a;--surface2:#141a14;--border:rgba(255,255,255,.07);--green:#2dff7a;--amber:#ffb84d;--blue:#4dc8ff;--text:#c8d4c8;--muted:#8fa68f;--white:#f0f5f0;--mono:'JetBrains Mono',monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;overflow-x:hidden}
    .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:48px 16px}
    .hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);pointer-events:none;z-index:10}
    .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(45,255,122,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(45,255,122,.03) 1px,transparent 1px);background-size:40px 40px}
    .glow{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:800px;height:400px;background:radial-gradient(ellipse,rgba(45,255,122,.06) 0%,transparent 70%);pointer-events:none}
    .wrap{position:relative;z-index:20;width:min(720px,96vw);text-align:center}
    .logo{height:72px;width:auto;margin:0 auto 32px;display:block}
    h1{font-size:clamp(32px,5vw,58px);font-weight:800;color:var(--white);letter-spacing:-1.5px;line-height:1.05;margin-bottom:14px}
    h1 span{color:var(--green)}
    .sub{font-size:17px;color:rgba(200,212,200,.85);max-width:540px;margin:0 auto 40px;line-height:1.6}
    .terminal{background:#060a06;border:1px solid rgba(45,255,122,.2);border-radius:14px;overflow:hidden;text-align:left;box-shadow:0 0 0 1px rgba(45,255,122,.05),0 40px 80px rgba(0,0,0,.8),0 0 60px rgba(45,255,122,.04)}
    .bar{background:#0d130d;border-bottom:1px solid rgba(45,255,122,.12);padding:0 16px;height:32px;display:flex;align-items:center;gap:12px;user-select:none}
    .dots{display:flex;gap:6px}.dot{width:12px;height:12px;border-radius:50%}.dot.r{background:#ff5f57}.dot.a{background:#febc2e}.dot.g{background:#28c840}
    .title{flex:1;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.05em}
    .status{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--green)}
    .status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .body{padding:20px;font-family:var(--mono);font-size:13px;line-height:1.9}
    .line{display:flex;gap:14px;opacity:0;animation:in .4s forwards}
    .line:nth-child(2){animation-delay:.5s}.line:nth-child(3){animation-delay:1s}.line:nth-child(4){animation-delay:1.5s}.line:nth-child(5){animation-delay:2s}
    @keyframes in{to{opacity:1}}
    .t{color:var(--muted);flex-shrink:0}.ok{color:var(--green)}.warn{color:var(--amber)}.info{color:var(--blue)}
    .cursor{display:inline-block;width:8px;height:14px;background:var(--green);vertical-align:-2px;animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    @media(max-width:600px){.status{display:none}.body{font-size:12px}}
  </style>
</head>
<body>
  <section class="hero">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="wrap">
      <img class="logo" src="/images/neocloudz-logo.png" alt="NeoCloudz">
      <h1>Coming <span>soon</span></h1>
      <p class="sub">This service is being provisioned. Check back shortly.</p>
      <div class="terminal">
        <div class="bar">
          <div class="dots"><span class="dot r"></span><span class="dot a"></span><span class="dot g"></span></div>
          <div class="title" id="title">neocloudz — provisioning</div>
          <div class="status">PROVISIONING</div>
        </div>
        <div class="body">
          <div class="line"><span class="t">00:00:01</span><span><span class="ok">$</span> neocloudz deploy <span id="host">this-service</span></span></div>
          <div class="line"><span class="t">00:00:02</span><span class="info">→ allocating GPU cluster ... ok</span></div>
          <div class="line"><span class="t">00:00:03</span><span class="info">→ wiring NVLink fabric ... ok</span></div>
          <div class="line"><span class="t">00:00:04</span><span class="warn">⚠ service not yet public — coming soon</span></div>
          <div class="line"><span class="t">00:00:05</span><span><span class="ok">$</span> <span class="cursor"></span></span></div>
        </div>
      </div>
    </div>
  </section>
  <script>
    var h = location.hostname;
    document.getElementById('host').textContent = h;
    document.getElementById('title').textContent = 'neocloudz — ' + (h.split('.')[0] || 'provisioning');
  </script>
</body>
</html>
